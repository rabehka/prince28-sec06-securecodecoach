name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: securecodecoach
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run unit and integration tests with coverage
        env:
          APP_ENV: ci
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres  # pragma: allowlist secret
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
        run: |
          export DATABASE_URL="postgresql://${TEST_DB_USER}:${TEST_DB_PASSWORD}@${TEST_DB_HOST}:${TEST_DB_PORT}/securecodecoach?ssl=disable"
          uv run pytest -v --cov=securecodecoach --cov-report=term-missing

  image:
    name: build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to render
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for live /health to reflect new commit
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 30); do
            RESP=$(curl -fsS "${RENDER_URL%/}/health" || true)
            SHA=$(echo "$RESP" | python3 -c "import sys,json; d=json.loads(sys.stdin.read() or '{}'); print(d.get('git_sha') or d.get('version') or '')" 2>/dev/null || true)
            echo "Attempt $i: live sha=$SHA (expected $EXPECTED_SHA)"
            if [ "$SHA" = "$EXPECTED_SHA" ]; then
              echo "Deploy verified!"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for version $EXPECTED_SHA"
          exit 1
