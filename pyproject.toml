[project]
name = "securecodecoach"
version = "0.1.0"
description = "SecureCodeCoach - A secure coding mentor powered by OWASP guidance."
readme = "README.md"
authors = [
    { name = "rabekha", email = "rabehka12345@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "integration: tests that run against an isolated PostgreSQL database",
]

[tool.coverage.run]
source = ["securecodecoach"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.poe.tasks]
dev = "uvicorn securecodecoach.api.main:create_app --factory --reload --no-access-log"
lint = ["_ruff_check", "_ruff_format"]
_ruff_check = "ruff check ."
_ruff_format = "ruff format --check ."
test = "pytest tests/unit"
cov = "pytest --cov --cov-report=term-missing"
migrate = "alembic upgrade head"
seed = "python scripts/load_db.py"

[tool.poe.tasks.test-integration]
help = "Integration tests against the Postgres from docker compose"
cmd = "pytest tests/integration"
env.TEST_DATABASE_URL.default = "postgresql://app:app@localhost:5433/app_test"  # pragma: allowlist secret
